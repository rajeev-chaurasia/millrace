millrace:
  target: candidate
  outputs:
    candidate:
      type: duckdb
      path: "{{ env_var('MILLRACE_DUCKDB_PATH', '../data/millrace.duckdb') }}"
      schema: "{{ env_var('MILLRACE_DBT_SCHEMA') }}"
      threads: 4
      extensions:
        - httpfs
        - parquet
      secrets:
        - type: s3
          key_id: "{{ env_var('MILLRACE_S3_ACCESS_KEY') }}"
          secret: "{{ env_var('MILLRACE_S3_SECRET_KEY') }}"
          region: "{{ env_var('MILLRACE_S3_REGION', 'us-east-1') }}"
          endpoint: "{{ env_var('MILLRACE_S3_ENDPOINT', 'localhost:9000') }}"
          url_style: path
          use_ssl: false
          scope: "s3://{{ env_var('MILLRACE_S3_BUCKET', 'millrace') }}"
