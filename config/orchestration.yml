cutoff:
  relation: control.source_batch
  batch_column: batch_id
  event_timestamp_column: completed_at

spark:
  executable: spark-submit
  master: "local[2]"
  application: /opt/millrace/src/millrace/streaming/spark_job.py
  packages:
    - org.apache.spark:spark-sql-kafka-0-10_2.13:4.0.1
    - org.apache.hadoop:hadoop-aws:3.4.1
  conf:
    spark.jars.ivy: /tmp/millrace-ivy
    spark.sql.session.timeZone: UTC
    spark.streaming.stopGracefullyOnShutdown: "true"
  timeout_seconds: 1800
  bronze_uri: "s3a://millrace/bronze"

dbt:
  executable: dbt
  project_dir: dbt
  profiles_dir: dbt
  target: candidate
  selector: "+tag:candidate"
  timeout_seconds: 1200

readiness_timeout_seconds: 120
temporary_directory: artifacts/tmp
