name: ${COMPOSE_PROJECT_NAME:-millrace}

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  environment: &airflow-environment
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__PARALLELISM: "4"
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "4"
    AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG: "1"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY-}
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:?set AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD:?set AIRFLOW_DB_PASSWORD}@postgres:5432/${AIRFLOW_DB:?set AIRFLOW_DB}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_SECRET_KEY:?set AIRFLOW_SECRET_KEY}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?set AIRFLOW_JWT_SECRET}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME:?set AIRFLOW_ADMIN_USERNAME}
    AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?set AIRFLOW_ADMIN_PASSWORD}
    AIRFLOW_ADMIN_EMAIL: ${AIRFLOW_ADMIN_EMAIL:?set AIRFLOW_ADMIN_EMAIL}
    MILLRACE_POSTGRES_HOST: postgres
    MILLRACE_POSTGRES_PORT: "5432"
    MILLRACE_POSTGRES_DATABASE: ${POSTGRES_DB:?set POSTGRES_DB}
    MILLRACE_POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
    MILLRACE_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    MILLRACE_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    MILLRACE_S3_ENDPOINT_URL: http://minio:9000
    MILLRACE_S3_ENDPOINT: minio:9000
    MILLRACE_S3_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
    MILLRACE_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    MILLRACE_S3_BUCKET: ${MINIO_BUCKET:?set MINIO_BUCKET}
    MILLRACE_DUCKDB_PATH: /opt/millrace/data/millrace.duckdb
    MILLRACE_RECONCILIATION_CONFIG: /opt/millrace/config/reconciliation.yml
    MILLRACE_ORCHESTRATION_CONFIG: /opt/millrace/config/orchestration.yml
    MILLRACE_REPORTS_DIRECTORY: /opt/millrace/artifacts/reconciliation
    MILLRACE_PUSHGATEWAY_URL: ${MILLRACE_PUSHGATEWAY_URL-}
    MILLRACE_SPARK_MASTER: spark://spark-master:7077
  volumes:
    - ./airflow/dags:/opt/airflow/dags:ro
    - ./config:/opt/millrace/config:ro
    - ./dbt:/opt/millrace/dbt
    - ./src:/opt/millrace/src:ro
    - airflow-logs:/opt/airflow/logs
    - warehouse-data:/opt/millrace/data
    - reconciliation-reports:/opt/millrace/artifacts

services:
  postgres:
    image: postgres:16.10-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      AIRFLOW_DB: ${AIRFLOW_DB:?set AIRFLOW_DB}
      AIRFLOW_DB_USER: ${AIRFLOW_DB_USER:?set AIRFLOW_DB_USER}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:?set AIRFLOW_DB_PASSWORD}
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./infra/postgres/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  postgres-init:
    image: postgres:16.10-bookworm
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      AIRFLOW_DB: ${AIRFLOW_DB:?set AIRFLOW_DB}
      AIRFLOW_DB_USER: ${AIRFLOW_DB_USER:?set AIRFLOW_DB_USER}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:?set AIRFLOW_DB_PASSWORD}
    entrypoint: /bin/sh
    command:
      - -ec
      - |
        psql \
          --host postgres \
          --username "$${POSTGRES_USER}" \
          --dbname "$${POSTGRES_DB}" \
          --set ON_ERROR_STOP=1 \
          --set airflow_db="$${AIRFLOW_DB}" \
          --set airflow_user="$${AIRFLOW_DB_USER}" \
          --set airflow_password="$${AIRFLOW_DB_PASSWORD}" <<'SQL'
        SELECT format('CREATE ROLE %I LOGIN PASSWORD %L', :'airflow_user', :'airflow_password')
        WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'airflow_user')
        \gexec
        SELECT format('ALTER ROLE %I WITH LOGIN PASSWORD %L', :'airflow_user', :'airflow_password')
        \gexec
        SELECT format('CREATE DATABASE %I OWNER %I', :'airflow_db', :'airflow_user')
        WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = :'airflow_db')
        \gexec
        SELECT format('GRANT ALL PRIVILEGES ON DATABASE %I TO %I', :'airflow_db', :'airflow_user')
        \gexec
        SQL
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?set KAFKA_CLUSTER_ID}
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  connect:
    image: quay.io/debezium/connect:3.2.4.Final
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: millrace-connect
      CONFIG_STORAGE_TOPIC: millrace.connect.configs
      OFFSET_STORAGE_TOPIC: millrace.connect.offsets
      STATUS_STORAGE_TOPIC: millrace.connect.status
      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"
      REST_ADVERTISED_HOST_NAME: connect
      TOPIC_CREATION_ENABLE: "true"
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "true"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "true"
    ports:
      - "${KAFKA_CONNECT_PORT:-8083}:8083"
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8083/connectors >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  connect-init:
    build:
      context: .
      dockerfile: docker/connect-init/Dockerfile
    environment:
      CONNECT_URL: http://connect:8083
      DEBEZIUM_CONNECTOR_NAME: ${DEBEZIUM_CONNECTOR_NAME:?set DEBEZIUM_CONNECTOR_NAME}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    depends_on:
      connect:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: "no"

  spark-master:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: "7077"
      SPARK_MASTER_WEBUI_PORT: "8080"
    ports:
      - "${SPARK_MASTER_PORT:-7077}:7077"
      - "${SPARK_MASTER_UI_PORT:-8080}:8080"
    volumes:
      - ./infra/spark/metrics.properties:/opt/spark/conf/metrics.properties:ro
    healthcheck:
      test: ["CMD-SHELL", "/bin/bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  spark-worker:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_WORKER_WEBUI_PORT: "8081"
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: 2g
    ports:
      - "${SPARK_WORKER_UI_PORT:-8081}:8081"
    volumes:
      - ./infra/spark/metrics.properties:/opt/spark/conf/metrics.properties:ro
    depends_on:
      spark-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "/bin/bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8081'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    entrypoint: /bin/sh
    command:
      - -ec
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${MINIO_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:?set MINIO_BUCKET}
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  warehouse-init:
    image: alpine:3.22.1
    user: "0:0"
    command:
      - /bin/sh
      - -ec
      - |
        mkdir -p /warehouse /artifacts
        chown -R 50000:0 /warehouse /artifacts
        chmod -R 0775 /warehouse /artifacts
    volumes:
      - warehouse-data:/warehouse
      - reconciliation-reports:/artifacts
    restart: "no"

  airflow-init:
    <<: *airflow-common
    command:
      - bash
      - -ec
      - |
        airflow db migrate
        if ! airflow users list --output json |
          python -c 'import json, os, sys; users=json.load(sys.stdin); sys.exit(not any(user["username"] == os.environ["AIRFLOW_ADMIN_USERNAME"] for user in users))'
        then
          airflow users create \
            --username "$${AIRFLOW_ADMIN_USERNAME}" \
            --password "$${AIRFLOW_ADMIN_PASSWORD}" \
            --firstname Millrace \
            --lastname Admin \
            --role Admin \
            --email "$${AIRFLOW_ADMIN_EMAIL}"
        fi
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      warehouse-init:
        condition: service_completed_successfully
    restart: "no"

  airflow-api-server:
    <<: *airflow-common
    command: api-server
    ports:
      - "${AIRFLOW_API_PORT:-8082}:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/api/v2/monitor/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8974/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type DagProcessorJob --hostname \"$${HOSTNAME}\""]
      interval: 20s
      timeout: 10s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: docker/dashboard/Dockerfile
    profiles: [dashboard]
    command:
      - streamlit
      - run
      - dashboard/app.py
      - --server.address=0.0.0.0
      - --server.port=8501
    environment:
      MILLRACE_DUCKDB_PATH: /opt/millrace/data/millrace.duckdb
      MILLRACE_AIRFLOW_URL: http://airflow-api-server:8080
      PYTHONPATH: /opt/millrace:/opt/millrace/src
    ports:
      - "${STREAMLIT_PORT:-8501}:8501"
    depends_on:
      minio:
        condition: service_healthy
      airflow-api-server:
        condition: service_healthy
    volumes:
      - ./dashboard:/opt/millrace/dashboard:ro
      - warehouse-data:/opt/millrace/data:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8501/_stcore/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  pushgateway:
    image: prom/pushgateway:v1.11.1
    profiles: [monitoring]
    ports:
      - "${PUSHGATEWAY_PORT:-9091}:9091"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:9091/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?set GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres-data:
  kafka-data:
  minio-data:
  airflow-logs:
  warehouse-data:
  reconciliation-reports:
  prometheus-data:
  grafana-data:
