name: end-to-end

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  golden-run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - run: cp .env.example .env
      - run: docker compose up --detach --build
      - run: >-
          docker compose up --detach --no-deps --wait --wait-timeout 600
          postgres kafka connect spark-master spark-worker minio
          airflow-api-server airflow-scheduler airflow-dag-processor
      - run: uv sync --frozen --extra dev --extra dbt --extra dashboard
      - run: uv run pytest -m e2e
      - if: always()
        run: docker compose logs --no-color > compose.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: compose.log
      - if: always()
        run: docker compose down --volumes --remove-orphans
